name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # プロジェクトがリポジトリ直下でも ClipKeep/ の中でも動くように場所を探す
      - name: Locate Gradle project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts が見つかりません。プロジェクトがアップロードされているか確認してください。"
            ls -la
            exit 1
          fi
          d=$(dirname "$f")
          echo "見つかりました: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipKeep-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
