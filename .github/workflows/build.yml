name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # プロジェクトを探す。見つからなければリポジトリ内の zip を展開して再探索する。
      # → ClipKeep.zip を1個アップロードするだけでビルドできる。
      - name: Locate or extract Gradle project
        id: loc
        run: |
          pick() {
            find . -name settings.gradle.kts -not -path './.git/*' -not -path '*/build/*' \
            | while read -r s; do
                d=$(dirname "$s")
                if [ -f "$d/app/build.gradle.kts" ]; then echo "$d"; break; fi
              done
          }

          d=$(pick)

          if [ -z "$d" ]; then
            echo "完全なプロジェクトが見つかりません。zip を探して展開します。"
            found_zip=0
            while read -r z; do
              echo "展開中: $z"
              unzip -o -q "$z" -d _extracted && found_zip=1
            done < <(find . -name '*.zip' -not -path './.git/*')
            if [ "$found_zip" = "0" ]; then
              echo "zip も見つかりませんでした。"
            fi
            d=$(pick)
          fi

          if [ -z "$d" ]; then
            echo "::error::プロジェクトが見つかりません。ClipKeep.zip をリポジトリ直下にアップロードしてください。"
            echo "=== リポジトリの中身 ==="
            find . -type f -not -path './.git/*' | sort | head -100
            exit 1
          fi

          echo "プロジェクト: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "=== 中身 ==="
          ls -la "$d"
          echo "=== app モジュール ==="
          ls -la "$d/app"
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipKeep-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ steps.loc.outputs.dir }}/app/build/reports/**
            ${{ steps.loc.outputs.dir }}/build/reports/**
          if-no-files-found: ignore
